<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bento Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Noto+Serif+SC:wght@500;600&display=swap">
<style>
/* Layout concept: one Section on the card lab's grid (84px cells, 6px gaps, 7 card sizes). Cards are the lab's renderers;
   the pointer drags a lifted card freely, a placeholder shows where it will land, and every other card springs out of the way. */
:root{
  --bg:#eceef1; --canvas:#eceef1; --dot:#cfd4db; --sheet:#f5f6f8;
  --lt:.045; --wmo:.14;
  --paper:#FBFAF6; --paper-ink:#1b1b1b; --paper-line:#E7E3DA; --chat:#F7F7F8; --chat-q:#E9E9EB;
  --card:#ffffff; --ph:#e3e6ea; --sec:#f8f9fb; --sec-line:#dde1e7;
  --ink:#1b1f24; --ink2:#59626e; --ink3:#8b94a0; --line:#e1e5ea; --hover:#eef1f5;
  --accent:#2f5bd3; --accent-ink:#ffffff; --accent-soft:#e6ecfb;
  --note:oklch(0.97 0.05 95); --note-ink:oklch(0.36 0.06 85);
  --n1:#fff0a6; --n2:#ffd9dc; --n3:#d3efd6; --n4:#d6e6ff; --n-ink:#3a3322;
  --demo:#1f2329; --demo-ink:#c9ced6; --demo-line:#343a43; --mk-ring:rgba(0,0,0,.1);
  --card-sh:0 0 0 1px rgba(20,30,45,.06),0 1px 2px rgba(20,30,45,.05),0 6px 14px -8px rgba(20,30,45,.14);
  --card-sh-h:0 0 0 1px rgba(20,30,45,.08),0 2px 4px rgba(20,30,45,.06),0 14px 30px -12px rgba(20,30,45,.26);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121418; --canvas:#14171b; --dot:#262b32; --sheet:#171a1f;
  --lt:.08; --wmo:.14;
  --paper:#26251f; --paper-ink:#ece8dc; --paper-line:#3a382f; --chat:#202123; --chat-q:#343541;
  --card:#1f2329; --ph:#2a2f36; --sec:#1a1e23; --sec-line:#2b3139;
  --ink:#e6e9ed; --ink2:#a0a9b4; --ink3:#727b87; --line:#2b3139; --hover:#252a31;
  --accent:#8ea8ee; --accent-ink:#0f1520; --accent-soft:#232c42;
  --note:oklch(0.32 0.04 90); --note-ink:oklch(0.93 0.05 92);
  --n1:#d6ca8e; --n2:#d9b1b5; --n3:#a8cbb0; --n4:#a9bfdc; --n-ink:#24201a;
  --demo:#0b0d10; --demo-ink:#c9ced6; --demo-line:#22262c; --mk-ring:rgba(255,255,255,.22);
  --card-sh:0 0 0 1px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4),0 8px 18px -10px rgba(0,0,0,.6);
  --card-sh-h:0 0 0 1px rgba(255,255,255,.1),0 2px 4px rgba(0,0,0,.4),0 16px 32px -12px rgba(0,0,0,.75);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418; --canvas:#14171b; --dot:#262b32; --sheet:#171a1f;
  --lt:.08; --wmo:.14;
  --paper:#26251f; --paper-ink:#ece8dc; --paper-line:#3a382f; --chat:#202123; --chat-q:#343541;
  --card:#1f2329; --ph:#2a2f36; --sec:#1a1e23; --sec-line:#2b3139;
  --ink:#e6e9ed; --ink2:#a0a9b4; --ink3:#727b87; --line:#2b3139; --hover:#252a31;
  --accent:#8ea8ee; --accent-ink:#0f1520; --accent-soft:#232c42;
  --note:oklch(0.32 0.04 90); --note-ink:oklch(0.93 0.05 92);
  --n1:#d6ca8e; --n2:#d9b1b5; --n3:#a8cbb0; --n4:#a9bfdc; --n-ink:#24201a;
  --demo:#0b0d10; --demo-ink:#c9ced6; --demo-line:#22262c; --mk-ring:rgba(255,255,255,.22);
  --card-sh:0 0 0 1px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4),0 8px 18px -10px rgba(0,0,0,.6);
  --card-sh-h:0 0 0 1px rgba(255,255,255,.1),0 2px 4px rgba(0,0,0,.4),0 16px 32px -12px rgba(0,0,0,.75);
  color-scheme:dark}

/* aliases: the canvas chrome (bar, section, panel) reads the lab's tokens through these names */
:root{
  --surface:var(--card);--surface-2:var(--sec);--glass:color-mix(in srgb,var(--card) 80%,transparent);
  --ink-2:var(--ink2);--ink-3:var(--ink3);--line-2:color-mix(in srgb,var(--ink) 16%,transparent);
  --sec-fill:var(--sec);--shadow:var(--card-sh);--shadow-hover:var(--card-sh-h);
  --shadow-lift:0 0 0 1px rgba(20,30,45,.08),0 8px 16px -6px rgba(20,30,45,.18),0 36px 72px -20px rgba(20,30,45,.42);
  --ui:var(--sans);--display:"Newsreader","Songti SC","Noto Serif SC",Georgia,serif;--r-card:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow-lift:0 0 0 1px rgba(255,255,255,.14),0 8px 16px -6px rgba(0,0,0,.4),0 36px 72px -20px rgba(0,0,0,.85)}}
:root[data-theme="dark"]{--shadow-lift:0 0 0 1px rgba(255,255,255,.14),0 8px 16px -6px rgba(0,0,0,.4),0 36px 72px -20px rgba(0,0,0,.85)}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
a{color:inherit;text-decoration:none;-webkit-user-drag:none}
svg{-webkit-user-drag:none}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:14px;height:52px;margin:0 -16px;padding:0 20px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 var(--line)}
.top .brand{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.top .crumb{color:var(--ink-3);display:flex;align-items:center;gap:8px;font-size:12.5px}
.top .crumb b{color:var(--ink-2);font-weight:550}
.top .sp{flex:1}
.tb{height:30px;padding:0 11px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;color:var(--ink-2);transition:background .15s,color .15s}
.tb:hover{background:var(--hover);color:var(--ink)}
.tb:active{transform:scale(.97)}
.tb .ic{width:14px;height:14px}

/* ---------- section ---------- */
.wrap{max-width:1120px;margin:0 auto;padding-top:34px}
.sec-head{display:flex;align-items:baseline;gap:10px;padding:0 8px 12px}
.sec-head h1{margin:0;font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
.sec-head .n{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sec-head .hint{margin-left:auto;font-size:12.5px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.sec-head kbd{font:inherit;font-size:11px;padding:1px 5px;border-radius:5px;background:var(--hover);color:var(--ink-2)}
.sec{position:relative;width:max-content;max-width:100%;margin:0 auto;border-radius:14px;background:var(--sec);border:1px solid var(--sec-line);padding:10px;
  box-shadow:0 1px 2px rgba(20,30,45,.05);transition:box-shadow .25s}
.sec.dragging{border-color:color-mix(in srgb,var(--accent) 40%,var(--sec-line))}
.board{position:relative;transition:height .34s cubic-bezier(.2,.8,.2,1)}
/* grid dots: one per cell corner, visible while a card is in the air (or always, from the panel) */
.gridlines{position:absolute;inset:-3px;pointer-events:none;opacity:0;transition:opacity .25s;
  background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.6px);background-size:90px 90px;background-position:0 0}
.sec.dragging .gridlines,.sec.grid-always .gridlines{opacity:1}

/* placeholder: where the lifted card will land */
.ph{position:absolute;left:0;top:0;border-radius:var(--r-card);background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);
  opacity:0;transition:opacity .18s;pointer-events:none;will-change:transform}
.ph.on{opacity:1}

/* ---------- card frame (the lab's .c is the visible card; .card is the engine's box) ---------- */
.card{position:absolute;left:0;top:0;will-change:transform;touch-action:pan-y;z-index:1}
.card.pressed .in{scale:.985}
.card.lift{z-index:30}
.card.settling{z-index:20}
.card .in{position:absolute;inset:0;transform-origin:50% 50%;transition:scale .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.card.lift .in{scale:1.035;box-shadow:var(--shadow-lift);transition:scale .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.card.lift.rs .in{scale:1;box-shadow:0 0 0 2px var(--accent),var(--card-sh-h)}
.card.lift,.card.lift *{cursor:grabbing}
.card.lift.rs,.card.lift.rs *{cursor:nwse-resize}
.sec.dragging .card:not(.lift) .in{box-shadow:var(--card-sh)}
.szt{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:6;font-family:var(--mono);font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink);pointer-events:none}
/* resize handle */
.rz{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;opacity:0;transition:opacity .15s;z-index:5}
.rz::after{content:"";position:absolute;right:6px;bottom:6px;width:8px;height:8px;border-right:2px solid rgba(127,127,127,.9);border-bottom:2px solid rgba(127,127,127,.9);border-radius:0 0 3px 0}
.card:hover .rz{opacity:1}
.sec.dragging .rz{opacity:0}

/* ---------- card base ---------- */
.c{position:relative;flex:none;border-radius:12px;background:var(--card);box-shadow:var(--card-sh);overflow:hidden;display:flex;flex-direction:column;color:var(--ink);transition:box-shadow .2s,transform .2s;cursor:pointer;text-decoration:none}
.c:hover{box-shadow:var(--card-sh-h)}
.c.row{flex-direction:row}
.cv{position:relative;flex:none;margin:4px 4px 0;border-radius:8px;overflow:hidden;background:var(--ph)}
.c.row>.cv{margin:4px 0 4px 4px}
.c.col>.cv{margin:4px 4px 0}
.c.col>.tx{padding:7px 8px 8px}
.cv img{display:block;position:absolute;pointer-events:none;max-width:none}
.cv.flush{margin:0;border-radius:0}
.band{flex:1;min-height:0;display:flex;align-items:center;padding:0 8px}
.fill{flex:1 1 0;min-height:0}
.cv.bl{position:absolute;inset:0;margin:0;border-radius:0}
.c.bleed{background:var(--ph);color:#fff}
.shd{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 34%,rgba(0,0,0,.66));pointer-events:none}
.shd.top{background:linear-gradient(to bottom,rgba(0,0,0,.28),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 40%,rgba(0,0,0,.7))}
.ov{position:absolute;left:0;right:0;bottom:0;padding:0 10px 9px;display:flex;flex-direction:column;gap:4px;color:#fff;min-width:0}
.ov .tt{text-shadow:0 1px 8px rgba(0,0,0,.35)}
.ov .mt{color:rgba(255,255,255,.82)}
.tx{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:4px;padding:8px 10px 9px}
.c.row>.tx{justify-content:center;padding:6px 10px 6px 9px}
.tx .mt:last-child{margin-top:auto}
.c.row>.tx .mt:last-child{margin-top:0}
.tt{--l:2;--fs:13px;font-size:var(--fs);font-weight:600;line-height:1.3;letter-spacing:-.005em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--l);overflow:hidden;overflow-wrap:anywhere}
.ds{--l:3;font-size:12px;line-height:1.5;color:var(--ink2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--l);overflow:hidden;overflow-wrap:anywhere}
.mt{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;min-width:0;line-height:16px}
.mt>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.mt .r{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:3px}
.mt .dot{flex:none;opacity:.6}
.mk{width:16px;height:16px;flex:none;display:block}
.mk.sq{border-radius:4.5px;color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:inset 0 0 0 1px var(--mk-ring)}
.mk.lg{width:22px;height:22px;border-radius:6px;font-size:12px}
.av{width:16px;height:16px;border-radius:50%;background:var(--c);color:#fff;font-size:8.5px;font-weight:600;display:grid;place-items:center;flex:none;line-height:1}
.up{flex:none;font-size:9px;font-weight:700;line-height:12px;padding:0 3px;border-radius:3px;border:1px solid currentColor;opacity:.85}
.corner{position:absolute;left:6px;top:6px;display:flex}
.corner .mk{filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.dur{position:absolute;right:5px;bottom:5px;padding:0 5px;border-radius:4px;background:rgba(0,0,0,.74);color:#fff;font-size:10.5px;font-weight:600;line-height:17px;font-variant-numeric:tabular-nums}
.pg{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p) * 100%);background:#FF0033}
.pg.bili{background:#FB7299}
.cv:has(.pg) .dur{bottom:8px}
.bst{position:absolute;left:0;right:0;bottom:0;display:flex;gap:7px;white-space:nowrap;align-items:center;padding:16px 7px 5px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.62));color:#fff;font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums;line-height:14px}
.bst span{display:inline-flex;align-items:center;gap:3px}
.bst svg{width:12px;height:12px}
.bst b{margin-left:auto;font-weight:600}
.cv:has(.pg) .bst{padding-bottom:7px}
.pt{position:absolute;right:5px;top:5px;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.92);color:#18191c;font-size:10px;font-weight:700;line-height:16px;font-variant-numeric:tabular-nums}
.nimg{position:absolute;right:6px;top:6px;padding:0 6px;border-radius:9px;background:rgba(0,0,0,.42);color:#fff;font-size:10px;font-weight:600;line-height:17px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.heart{width:12px;height:12px;flex:none}
.stat{display:flex;gap:10px;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.c.pad{padding:10px 11px}
.c.pad>.tx{padding:0}

/* typographic web card */
.ty-top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);min-width:0;white-space:nowrap}
.ty-top span{overflow:hidden;text-overflow:ellipsis}

/* variant: quote */
.c.v-quote .q{font-family:var(--serif);font-weight:500;color:var(--ink);line-height:1.55;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--l,4);overflow:hidden;position:relative}
.c.v-quote .qm{font-family:var(--serif);font-size:34px;line-height:.7;height:16px;color:var(--tint);opacity:.85}
.c.v-quote .src{font-size:11.5px;font-weight:600;color:var(--ink2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden}
/* variant: brand */
.c.v-logo{isolation:isolate;background:color-mix(in srgb,var(--tint) calc(var(--lt) * 100%),var(--card))}
.c.v-logo>:not(.wm){position:relative;z-index:1}
.c.v-logo>.wm{position:absolute;z-index:0;pointer-events:none;opacity:var(--wmo)}
.c.v-brand{background:linear-gradient(155deg,color-mix(in srgb,var(--tint) 82%,#fff),var(--tint) 55%,color-mix(in srgb,var(--tint) 78%,#000));color:#fff}
.c.v-brand .bw{flex:1;display:grid;place-items:center;font-weight:750;letter-spacing:-.035em;text-shadow:0 4px 18px rgba(0,0,0,.16)}
.c.v-brand .mt{color:rgba(255,255,255,.86)}
.c.v-brand .tt{color:#fff}

/* video card from the board: full-bleed cover, centred play, title and duration on the dark foot */
.mshd{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(18,20,26,0) 38%,rgba(18,20,26,.8));pointer-events:none}
.play{position:absolute;left:50%;top:40%;translate:-50% -50%;width:var(--ps,46px);height:var(--ps,46px);border-radius:50%;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:scale .3s cubic-bezier(.2,.8,.2,1),background .3s}
.play::after{content:"";position:absolute;left:54%;top:50%;translate:-50% -50%;border-left:calc(var(--ps,46px) * .26) solid #fff;border-top:calc(var(--ps,46px) * .16) solid transparent;border-bottom:calc(var(--ps,46px) * .16) solid transparent}
.c:hover .play{scale:1.07;background:rgba(255,255,255,.24)}
.mo{position:absolute;left:0;right:0;bottom:0;padding:0 var(--mp,14px) calc(var(--mp,14px) - 2px);display:flex;flex-direction:column;gap:7px;color:#fff;min-width:0}
.mo .mt2{font-size:var(--mf,15px);font-weight:650;line-height:1.28;letter-spacing:-.01em;text-shadow:0 1px 10px rgba(0,0,0,.35);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.mo .mm{display:flex;align-items:center;gap:7px;min-width:0;font-size:11.5px;color:rgba(255,255,255,.8);line-height:18px}
.mo .mm .mk{width:18px;height:18px}
.mo .mm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mo .mdu{margin-left:auto;flex:none;padding:0 6px;border-radius:5px;background:rgba(255,255,255,.18);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.media .pg{height:3px}

/* GitHub */
.gh-h{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;min-width:0;white-space:nowrap}
.gh-h span{color:var(--ink3);overflow:hidden;text-overflow:ellipsis;flex:0 1000 auto;min-width:0;max-width:45%}
.gh-h span.nm{max-width:none;flex:0 1 auto}
.gh-h b{font-weight:600;white-space:nowrap;flex:none}
.rn{display:block;font-size:11px;letter-spacing:-.01em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c.pp{background:var(--paper);color:var(--paper-ink)}
.pid{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:#B31B1B;white-space:nowrap;overflow:hidden}
.pid .mk{width:13px;height:13px}
.ptt{font-family:var(--serif);font-weight:600;line-height:1.15;letter-spacing:-.01em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--l);overflow:hidden}
.pau{font-family:var(--serif);font-style:italic;font-size:11px;color:color-mix(in srgb,var(--paper-ink) 62%,transparent);line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--l);overflow:hidden}
.pab{font-family:var(--serif);line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--l);overflow:hidden;min-height:0;color:color-mix(in srgb,var(--paper-ink) 80%,transparent)}
.pln{margin-top:auto;display:flex;flex-direction:column;gap:5px}
.pln i{height:3px;border-radius:2px;background:var(--paper-line)}
.pln i:nth-child(2){width:86%}.pln i:nth-child(3){width:64%}
.c.cc{background:var(--chat)}
.cmk{flex:none;width:14px;height:14px;border-radius:50%;background:#10A37F;display:inline-block}
.cq{align-self:flex-end;max-width:84%;padding:5px 9px;border-radius:12px;background:var(--chat-q);font-size:12px;line-height:1.35;flex:none}
.cq span{overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--l);overflow:hidden}
.ca{position:relative;display:flex;flex-direction:column;padding-left:21px;min-width:0;min-height:0;flex:1}
.ca>i{position:absolute;left:0;top:2px;width:14px;height:14px;border-radius:50%;background:#10A37F}

.skl{display:flex;flex-direction:column;gap:7px}

.stack{display:flex;flex-direction:column;gap:18px}

.rows{display:flex;flex-direction:column}

.gav{flex:none;width:20px;height:20px;border-radius:6px;background:linear-gradient(140deg,#6965db,#3f3ca8);color:#fff;font:700 10px/20px var(--sans);text-align:center}

.gf span{display:inline-flex;align-items:center;gap:4px}

.st-pill svg{width:11px;height:11px}

/* notes */
.c.note{cursor:text}
.c.n-bd{background:var(--note);color:var(--note-ink);padding:11px 13px;gap:5px}
.c.n-bd .note-l{flex:none;font-size:10px;font-weight:650;opacity:.7;letter-spacing:.03em;text-transform:uppercase;line-height:1.2}
.c.n-bd .fit{line-height:1.5}
.c.n-bd .nh{font-weight:650}
.c.note .fit{flex:1;min-height:0;overflow:hidden;overflow-wrap:anywhere;white-space:pre-wrap;text-wrap:pretty;line-break:strict}
.c.n-a{background:var(--n1);color:var(--n-ink);box-shadow:0 0 0 1px rgba(60,45,0,.06),0 1px 2px rgba(60,45,0,.06),0 8px 16px -10px rgba(60,45,0,.22);padding:11px 12px}
.c.n-a[data-c="2"]{background:var(--n2)} .c.n-a[data-c="3"]{background:var(--n3)} .c.n-a[data-c="4"]{background:var(--n4)}
.c.n-a .fit{font-weight:500;line-height:1.42}
.c.n-b{padding:12px 13px 10px}
.c.n-b .fit{font-family:var(--serif);font-weight:500;line-height:1.55;color:var(--ink)}
.c.n-b .nd{flex:none;font-size:10.5px;color:var(--ink3);padding-top:6px;display:flex;gap:6px;font-variant-numeric:tabular-nums}
.c.n-c{background:transparent;box-shadow:none;padding:6px 4px;color:var(--ink)}
.c.n-c:hover{box-shadow:inset 0 0 0 1.5px var(--sec-line);transform:none}
.c.n-c .fit{font-weight:700;letter-spacing:-.02em;line-height:1.2}
.chk{list-style:none;margin:.3em 0 0;padding:0;display:flex;flex-direction:column;gap:.28em}
.chk li{display:flex;gap:.45em;align-items:flex-start;line-height:1.35}
.chk li i{flex:none;width:.95em;height:.95em;margin-top:.2em;border-radius:.25em;border:1.5px solid currentColor;opacity:.55}
.chk li.dn{opacity:.5;text-decoration:line-through}
.chk li.dn i{background:currentColor;opacity:.7}
.nh{font-weight:700}
.n-c .chk{font-weight:500;letter-spacing:0}

/* link list */
.c.lst{padding:4px 4px 2px;cursor:default}
.lh{flex:none;display:flex;align-items:center;gap:7px;height:30px;padding:0 6px 0 7px;min-width:0}
.lh b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lh .n{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.lr{flex:none;display:flex;align-items:center;gap:8px;height:var(--rh,28px);padding:0 7px;border-radius:8px;min-width:0;color:var(--ink);text-decoration:none;cursor:pointer}
.lr:hover{background:var(--hover)}
.lr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:500}
.lr .s{flex:none;font-size:11px;color:var(--ink3);max-width:36%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .ck{flex:none;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center}
.lr.dn .ck{background:var(--accent);border-color:var(--accent)}
.lr.dn .ck::after{content:"";width:6px;height:3.5px;border-left:1.6px solid var(--accent-ink);border-bottom:1.6px solid var(--accent-ink);rotate:-45deg;margin-top:-1.5px}
.lr.dn .t{color:var(--ink3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink3) 60%,transparent);font-weight:400}
.lr.th{height:var(--rh,48px);gap:9px;padding:0 6px 0 5px}
.lr.th .tw{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lr.th .t{flex:none;line-height:17px}
.lr.th .s{max-width:none;display:flex;align-items:center;gap:5px;line-height:15px}
.tn{flex:none;width:40px;height:40px;border-radius:7px;overflow:hidden;position:relative;background:var(--ph);display:grid;place-items:center}
.tn img{display:block}
.tn .mk.sq{width:40px;height:40px;border-radius:7px;font-size:17px}
.tile{width:40px;height:40px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 12%,var(--card))}
.tile .mk{width:20px;height:20px}
.tile .mk.sq{width:22px;height:22px;font-size:11px;border-radius:6px}
.lr.th.sh{height:30px}
.lr.th.sh .t{flex:1}
.tn0{flex:none;width:40px;display:grid;place-items:center}
.c.lst.v-logo .lr:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.lpop{width:300px;height:444px;flex:none;border-radius:14px;background:var(--card);box-shadow:var(--card-sh-h);display:flex;flex-direction:column;padding:6px 6px 0;overflow:hidden}
.lp-h{flex:none;display:flex;align-items:center;gap:7px;height:34px;padding:0 4px 0 8px}
.lp-h b{font-size:14px;font-weight:650}
.lp-h .n{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.lp-x{margin-left:auto;width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--ink3);font-size:18px;line-height:1;cursor:pointer}
.lp-x:hover{background:var(--hover)}
.lp-q{flex:none;display:flex;align-items:center;gap:6px;height:30px;margin:2px 4px 6px;padding:0 9px;border-radius:8px;background:var(--hover);color:var(--ink3)}
.lp-q svg{width:13px;height:13px;flex:none}
.lp-q input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--ink);outline:none}
.lp-f{flex:none;display:flex;gap:5px;padding:0 4px 6px;overflow-x:auto;scrollbar-width:none}
.lp-f button{flex:none;height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink2);font:inherit;font-size:11.5px;display:inline-flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
.lp-f button span{color:var(--ink3);font-variant-numeric:tabular-nums}
.lp-f button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.lp-f button.on span{color:color-mix(in srgb,var(--card) 65%,transparent)}
.lp-rows{flex:1;min-height:0;overflow-y:auto;padding-bottom:6px;overscroll-behavior:contain}
.lp-rows .lr .s{font-variant-numeric:tabular-nums}
.c.lst.la{padding:6px}
.la .lh{height:42px;padding-bottom:2px}
.la .lr{height:30px}
.c.lst.lc{padding:4px}
.lc .lh{height:31px}
.lc .lr.th{height:45px}
.lc .tn{width:36px;height:36px}
.lc .tn img{margin:-2px}
.lc .tile{width:36px;height:36px}
.lr.lmore{color:var(--ink3);font-size:11.5px;padding-left:31px}
.lr.lmore.one{padding-left:7px}
.lc .lr.th.lmore{padding-left:5px}
.lc .lmore .t{color:var(--ink);font-weight:500}
.lmore .rb{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.lmore .s{gap:9px}
.tn.mos{display:grid;grid-template-columns:repeat(2,17px);grid-auto-rows:17px;gap:2px;background:transparent;border-radius:7px}
.tn.mos>span{width:17px;height:17px;border-radius:4px;overflow:hidden;display:grid;place-items:center;background:var(--ph)}
.tn.mos img{margin:-11.5px}
.tn.mos .tile{width:17px;height:17px}
.tn.mos .tile .mk{width:10px;height:10px}
.tn.mos .tile .mk.sq{width:11px;height:11px;font-size:6.5px;border-radius:3px}
.l1a{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:8px 8px 7px 9px;min-width:0}
.l1g{display:grid;grid-template-columns:repeat(2,22px);gap:3px}
.l1g .tn{width:22px;height:22px;border-radius:6px}
.l1g .tn img{margin:-9px}
.l1g .tile{width:22px;height:22px}
.l1g .tile .mk{width:13px;height:13px}
.l1g.one{grid-template-columns:47px}
.l1g.one .tn,.l1g.one .tile{width:47px;height:47px;border-radius:10px}
.l1g.one .tile .mk{width:24px;height:24px}
.l1g .tile .mk.sq{width:14px;height:14px;font-size:8px;border-radius:4px}
.l1ft{display:flex;align-items:baseline;gap:4px;min-width:0}
.l1ft b{flex:1;min-width:0;font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1ft .n{flex:none;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.l1b{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:8px 9px}
.l1b b{font-size:13px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.l1b .n{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--ink3);line-height:1;font-variant-numeric:tabular-nums}
.l1c{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:8px 9px}
.l1t{position:relative;width:36px;height:36px}
.l1t .tn{width:36px;height:36px;border-radius:9px}
.l1t .tn img{margin:-2px}
.l1t .tile{width:36px;height:36px}
.l1t .bd{position:absolute;left:28px;top:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--card);font-size:10.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--card)}
.l1c b{font-size:12px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.lmore{flex:none;height:24px;padding:0 8px;display:flex;align-items:center;font-size:11.5px;color:var(--ink3)}
.stk{display:flex;padding-left:4px}
.stk .si{margin-left:-4px;width:20px;height:20px;border-radius:6px;background:var(--card);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center}
.stk .si .mk{width:14px;height:14px}
.stk .si .mk.sq{font-size:8px;border-radius:4px}
.l1{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:6px 6px 5px 7px;min-height:0}
.l1 b{font-size:12.5px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.l1f{display:flex;align-items:center;gap:4px;min-width:0}
.l1f .n{margin-left:auto;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.lh.lh21{height:24px;padding:0 6px 0 7px}
.lh .n{margin-left:auto}
.lr.mini{height:24px}
.lr.mini .mk{width:14px;height:14px}
.lr.mini .t{font-size:12px}
.l21{flex:1;display:flex;align-items:center;gap:10px;padding:4px 10px 4px 8px;min-width:0}
.l21l{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.l21l b{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l21 .n{flex:none;font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}

/* native-look comparison */
.nat{width:174px;flex:none;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.nat .ni{position:relative;border-radius:10px;overflow:hidden;background:var(--ph)}
.nat .ni img{display:block}
.nat-yt .row2{display:flex;gap:8px}
.nat-yt .av{width:24px;height:24px;font-size:10px}
.nat-yt .tt{font-size:13px;font-weight:600}
.nat-yt .s{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.35}
.nat-bili{background:var(--card);border-radius:6px;overflow:hidden;padding-bottom:8px;gap:6px}
.nat-bili .ni{border-radius:6px 6px 0 0}
.nat-bili .tt{font-size:13px;font-weight:500;padding:0 8px;line-height:1.4}
.nat-bili .s{padding:0 8px;font-size:11px;color:var(--ink3);display:flex;gap:5px;align-items:center}
.nat-xhs{background:#fff;border-radius:8px;overflow:hidden;padding-bottom:9px;gap:7px;color:#222}
.nat-xhs .ni{border-radius:8px 8px 0 0}
.nat-xhs .tt{font-size:13px;font-weight:500;padding:0 9px;color:#222}
.nat-xhs .s{padding:0 9px;display:flex;gap:6px;align-items:center;font-size:11px;color:#666}
.nat-xhs .s .r{margin-left:auto;display:inline-flex;gap:3px;align-items:center}

/* ---------- tuning panel ---------- */
.panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50;width:290px;max-width:calc(100vw - 32px);
  border-radius:18px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:0 0 0 .5px var(--line-2),0 24px 48px -16px rgba(20,30,45,.3);overflow:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.panel.closed{transform:translateY(calc(100% - 44px))}
.panel header{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;font-weight:650;font-size:13px;cursor:pointer}
.panel header .sp{flex:1}
.panel header .chev{transition:transform .3s}
.panel.closed header .chev{transform:rotate(180deg)}
.panel .body{padding:2px 16px 14px;display:flex;flex-direction:column;gap:10px;max-height:min(62vh,560px);overflow:auto}
.fld{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:12.5px}
.fld label{color:var(--ink-2)}
.fld output{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.fld input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:0;height:22px}
.fld select{grid-column:1 / -1;font:inherit;font-size:12.5px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:0 8px}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-2);min-height:26px}
.sw input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.pgroup{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:6px}
.btn{height:30px;padding:0 11px;border-radius:9px;background:var(--hover);font-size:12.5px;font-weight:550;color:var(--ink);transition:background .15s}
.btn:hover{background:var(--line-2)}
.btn:active{transform:scale(.97)}
.presets{display:flex;gap:6px}
.presets .btn{flex:1;padding:0;text-align:center}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));translate:-50% 8px;z-index:60;padding:9px 14px;border-radius:12px;background:var(--ink);color:var(--bg);
  font-size:12.5px;font-weight:550;box-shadow:var(--shadow-lift);opacity:0;transition:opacity .2s,translate .3s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.toast.on{opacity:1;translate:-50% 0}
@media (max-width:700px){ .top .crumb{display:none} .sec-head h1{font-size:24px} .sec-head .hint{display:none} }
@media (prefers-reduced-motion: reduce){ .card .in,.board,.ph,.panel{transition:none} }
</style>
</head>
<body>

<div class="top">
  <span class="brand">Links</span>
  <span class="crumb"><span>Bento Canvas</span><span>·</span><b>周末</b></span>
  <span class="sp"></span>
  <button class="tb" id="addBtn" title="添加一张卡片"><svg class="ic" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>添加</button>
  <button class="tb" id="shuffleBtn" title="随机排布"><svg class="ic" viewBox="0 0 16 16"><path d="M2.5 4.5h2.2c1.2 0 2 .6 2.6 1.6l1.4 2.8c.6 1 1.4 1.6 2.6 1.6h2.2M2.5 11.5h2.2c1.2 0 2-.6 2.6-1.6M8.7 6.1c.6-1 1.4-1.6 2.6-1.6h2.2M11.5 2.5l2 2-2 2M11.5 8.5l2 2-2 2"/></svg>打乱</button>
  <button class="tb" id="resetBtn" title="恢复初始布局"><svg class="ic" viewBox="0 0 16 16"><path d="M5.5 4 2.5 7l3 3"/><path d="M2.5 7h7a3.5 3.5 0 0 1 0 7H7"/></svg>重置</button>
  <button class="tb" id="themeBtn" title="切换深浅色"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2.5v1M8 12.5v1M2.5 8h1M12.5 8h1M4.1 4.1l.7.7M11.2 11.2l.7.7M4.1 11.9l.7-.7M11.2 4.8l.7-.7"/><circle cx="8" cy="8" r="2.8"/></svg></button>
</div>

<main class="wrap" id="wrap">
  <div class="sec-head">
    <h1>周末</h1>
    <span class="n" id="count"></span>
    <span class="hint"><span>拖动卡片移动</span><span>拖右下角改大小</span><span><kbd>Esc</kbd> 取消</span></span>
  </div>
  <section class="sec" id="sec">
    <div class="board" id="board">
      <div class="gridlines"></div>
      <div class="ph" id="ph"></div>
      <div id="cards"></div>
    </div>
  </section>
</main>

<aside class="panel closed" id="panel">
  <header id="panelHead">
    <svg class="ic" viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10"/><circle cx="6" cy="4.5" r="1.4" fill="var(--glass)"/><circle cx="10.5" cy="8" r="1.4" fill="var(--glass)"/><circle cx="7" cy="11.5" r="1.4" fill="var(--glass)"/></svg>
    手感调参
    <span class="sp"></span>
    <svg class="ic chev" viewBox="0 0 16 16"><path d="m4.5 9.5 3.5-3.5 3.5 3.5"/></svg>
  </header>
  <div class="body">

/* which sizes each kind opens; anything else snaps to the nearest open one */
const NO = (...x) => ALL.filter(s => !x.includes(s));
const OPEN = {paper:ALL, chat:ALL, yt:ALL, bili:ALL, yts:ALL, xhs:ALL, web:ALL, gh:NO('1x2','2x3'), ghpr:NO('3x2','2x3'), note:ALL, list:ALL, listc:['2x2','3x2','2x3']};

function snapTo(open, w, h){
  let best = null, bd = 1e9;
  for (const s of open) { const [a, b] = s.split('x').map(Number), d = (a - w) ** 2 + (b - h) ** 2 + (a * b) * .01; if (d < bd) { bd = d; best = [a, b]; } }
  return best;
}

function fitAll(root){
  root.querySelectorAll('.fill').forEach(el => {
    el.hidden = false; el.style.flex = ''; el.style.maxHeight = ''; el.style.removeProperty('--l');
    const lh = parseFloat(getComputedStyle(el).lineHeight) || 18, n = Math.floor((el.clientHeight + 1) / lh);
    if (n < 1) { el.hidden = true; return; }
    el.style.setProperty('--l', n); el.style.flex = 'none'; el.style.maxHeight = (n * lh) + 'px';
  });
  root.querySelectorAll('.fit').forEach(el => {
    const lo = +el.dataset.min; let f = +el.dataset.max;
    el.style.fontSize = f + 'px';
    while (f > lo && (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1)) { f -= .5; el.style.fontSize = f + 'px'; }
  });

/* ============ layout: make room ============ */
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const byPos = (a, b) => a.y - b.y || a.x - b.x;
// Rebuild the layout from the committed one (L0) with item `id` forced to (tx,ty,tw,th).
// Starting from L0 every time (not from the last preview) means moving the pointer back puts everything back.
function resolve(L0, id, tx, ty, tw, th){
  const list = L0.map(o => ({...o}));
  const d = id ? list.find(i => i.id === id) : null;
  let origin = null;
  if (d) { origin = {x:d.x, y:d.y, w:d.w, h:d.h}; d.x = tx; d.y = ty; d.w = tw; d.h = th; }
  for (const it of list) { it.w = clamp(it.w, 1, cols); it.x = clamp(it.x, 0, cols - it.w); it.y = Math.max(0, it.y); it.h = Math.max(1, it.h); }
  const placed = d ? [d] : [];
  const others = list.filter(i => i !== d).sort(byPos);
  const movingDown = d && ty > origin.y;
  for (const it of others) {
    let hits = placed.filter(p => hit(it, p));
    if (hits.length) {
      let done = false;
      const direct = d && hits.includes(d);
      if (cfg.mode === 'smart' && direct) {
        // 1) the hole the dragged card left behind: a card that fits there slides in (same-size cards swap)
        if (it.w <= origin.w && it.h <= origin.h) {
          outer: for (let yy = origin.y; yy + it.h <= origin.y + origin.h; yy++) for (let xx = origin.x; xx + it.w <= origin.x + origin.w; xx++) {
            const c = {x:xx, y:yy, w:it.w, h:it.h};
            if (!placed.some(p => hit(c, p))) { it.x = xx; it.y = yy; done = true; break outer; }
          }
        }
        // 2) dragging downward over a card: that card goes above instead of being pushed further down
        if (!done && movingDown) {
          const c = {x:it.x, y:Math.max(0, ty - it.h), w:it.w, h:it.h};
          if (c.y + c.h <= ty && !placed.some(p => hit(c, p))) { it.y = c.y; done = true; }
        }
      }
      // 3) otherwise push it down until it is clear
      let guard = 0;
      while (!done && hits.length && guard++ < 200) { it.y = Math.max(...hits.map(p => p.y + p.h)); hits = placed.filter(p => hit(it, p)); }
    }
    placed.push(it);
  }
  if (cfg.compact) {
    const fixed = [];
    for (const it of list.slice().sort(byPos)) {
      while (it.y > 0) { const c = {...it, y:it.y - 1}; if (fixed.some(p => hit(c, p))) break; it.y--; }
      fixed.push(it);
    }
  }
  return list;
}

/* ============ springs ============ */
// One spring per axis, integrated every frame. Retargeting keeps velocity, so a card that is sent back
// mid-flight turns around instead of restarting.
let raf = 0, last = 0;
function kick(){ if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
function spring(p, v, t, k, c, dt){ const a = k * (t - p) - c * v; v += a * dt; p += v * dt; return [p, v]; }
function stepNode(n, dt, k = cfg.k, c = cfg.c){
  if (reduceMotion.matches) { n.x = n.tx; n.y = n.ty; n.w = n.tw; n.h = n.th; n.vx = n.vy = n.vw = n.vh = 0; return false; }
  [n.x, n.vx] = spring(n.x, n.vx, n.tx, k, c, dt);
  [n.y, n.vy] = spring(n.y, n.vy, n.ty, k, c, dt);
  [n.w, n.vw] = spring(n.w, n.vw, n.tw, k * 1.3, c * 1.15, dt);
  [n.h, n.vh] = spring(n.h, n.vh, n.th, k * 1.3, c * 1.15, dt);
  const rest = Math.abs(n.x - n.tx) < .08 && Math.abs(n.y - n.ty) < .08 && Math.abs(n.vx) < 1 && Math.abs(n.vy) < 1
    && Math.abs(n.w - n.tw) < .08 && Math.abs(n.h - n.th) < .08 && Math.abs(n.vw) < 1 && Math.abs(n.vh) < 1;
  if (rest) { n.x = n.tx; n.y = n.ty; n.w = n.tw; n.h = n.th; n.vx = n.vy = n.vw = n.vh = 0; }
  return !rest;
}
const phs = {x:0, y:0, w:0, h:0, vx:0, vy:0, vw:0, vh:0, tx:0, ty:0, tw:0, th:0};
function tick(now){
  raf = 0;
  const dt = Math.min(0.032, Math.max(0.001, (now - last) / 1000)); last = now;
  let busy = false;
  for (const n of nodes.values()) {
    if (n.free) {
      // the lifted card: a follow spring toward the hand (or 1:1 when off), plus a tilt spring
      if (drag && !drag.rs && cfg.follow && !reduceMotion.matches) {
        [n.x, n.vx] = spring(n.x, n.vx, drag.px, cfg.fk, cfg.fc, dt);
        [n.y, n.vy] = spring(n.y, n.vy, drag.py, cfg.fk, cfg.fc, dt);
        paint(n);
      }
      // resizing: the card's box springs to the snapped size while its content is already laid out for it
      if (drag && drag.rs) { if (stepNode(n, dt, cfg.fk, cfg.fc)) { busy = true; } paint(n); }
      [n.r, n.vr] = spring(n.r, n.vr, n.tr, 260, 22, dt);
      if (Math.abs(n.r - n.tr) < .02 && Math.abs(n.vr) < .5) { n.r = n.tr; n.vr = 0; } else busy = true;
      n.inn.style.transform = n.r ? `rotate(${n.r.toFixed(2)}deg)` : '';
      continue;
    }
    const moving = stepNode(n, dt);
    if (n.r || n.vr) { [n.r, n.vr] = spring(n.r, n.vr, 0, 260, 22, dt); if (Math.abs(n.r) < .02 && Math.abs(n.vr) < .5) { n.r = 0; n.vr = 0; } else busy = true; }
    if (moving || n.painted !== 1) { paint(n); n.painted = moving ? 0 : 1; }
    if (moving) busy = true; else if (n.el.classList.contains('settling')) n.el.classList.remove('settling');
  }
  if (drag) {
    // placeholder spring (a bit stiffer than the cards, so it leads them)
    [phs.x, phs.vx] = spring(phs.x, phs.vx, phs.tx, 700, 42, dt);
    [phs.y, phs.vy] = spring(phs.y, phs.vy, phs.ty, 700, 42, dt);
    [phs.w, phs.vw] = spring(phs.w, phs.vw, phs.tw, 700, 42, dt);
    [phs.h, phs.vh] = spring(phs.h, phs.vh, phs.th, 700, 42, dt);
    ph.style.transform = `translate3d(${phs.x}px,${phs.y}px,0)`; ph.style.width = phs.w + 'px'; ph.style.height = phs.h + 'px';
    autoScroll(dt);
    busy = true;
  }
  if (busy) kick();
}

/* ============ pointer: press, lift, drag, drop ============ */
let press = null, drag = null;
const pagePt = e => ({x:e.pageX, y:e.pageY, cx:e.clientX, cy:e.clientY});
function boardOrigin(){ const r = board.getBoundingClientRect(); return {x:r.left + scrollX, y:r.top + scrollY}; }

layer.addEventListener('pointerdown', e => {
  if (e.button !== 0 || drag || press) return;
  const el = e.target.closest('.card'); if (!el) return;
  if (e.target.closest('a[href]')) return;
  const n = nodes.get(el.dataset.id); if (!n) return;
  const p = pagePt(e);
  press = {n, rs:!!e.target.closest('.rz'), x0:p.x, y0:p.y, pid:e.pointerId, touch:e.pointerType !== 'mouse', timer:0};
  el.setPointerCapture(e.pointerId);
  el.classList.add('pressed');
  // touch: hold briefly to lift, so a swipe still scrolls the page
  if (press.touch) press.timer = setTimeout(() => { if (press && !drag) begin(press, p); }, 180);
});
layer.addEventListener('pointermove', e => {
  if (!press) return;
  const p = pagePt(e);
  if (!drag) {
    const dist = Math.hypot(p.x - press.x0, p.y - press.y0);
    if (press.touch) { if (dist > 10) release(); return; }
    if (dist > 4) begin(press, p);
    else return;
  }
  move(p);
});
layer.addEventListener('pointerup', e => { if (!press) return; if (drag) drop(); else release(); });
layer.addEventListener('pointercancel', () => { if (drag) cancel(); else release(); });
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, {passive:false});
addEventListener('keydown', e => { if (e.key === 'Escape' && drag) cancel(); });
addEventListener('blur', () => { if (drag) cancel(); });

function release(){ if (!press) return; clearTimeout(press.timer); press.n.el.classList.remove('pressed'); press = null; }

function begin(pr, p){
  clearTimeout(pr.timer);
  const n = pr.n, it = n.it;
  n.free = true; n.vx = n.vy = n.vw = n.vh = 0;
  const o = boardOrigin();
  drag = {
    n, rs:pr.rs, L0:items.map(i => ({...i})),
    origin:{x:it.x, y:it.y, w:it.w, h:it.h},
    tx:it.x, ty:it.y, tw:it.w, th:it.h, rw:it.w, rh:it.h,
    offX:p.x - o.x - n.x, offY:p.y - o.y - n.y,
    w0:n.w, h0:n.h, x0:p.x, y0:p.y, px:n.x, py:n.y,
    last:p, samples:[{t:performance.now(), x:p.x, y:p.y}], layout:null, client:{x:p.cx, y:p.cy}
  };
  n.el.classList.remove('pressed'); n.el.classList.add('lift'); if (pr.rs) { n.el.classList.add('rs'); sizeTag(n, it.w, it.h); }
  sec.classList.add('dragging');
  Object.assign(phs, {x:n.x, y:n.y, w:n.w, h:n.h, tx:n.x, ty:n.y, tw:n.w, th:n.h, vx:0, vy:0, vw:0, vh:0});
  ph.className = 'ph on';
  if (navigator.vibrate && pr.touch) { try { navigator.vibrate(8); } catch(e) {} }
  move(p);
  kick();
}
function sizeTag(n, w, h){ let t = $('.szt', n.el); if (!t) { t = document.createElement('span'); t.className = 'szt'; n.el.appendChild(t); } t.textContent = `${w}×${h}`; }
// hysteresis: a cell only changes once the card is clearly past the boundary, so it never flickers on the edge
function pick(f, cur){ return Math.abs(f - cur) <= 0.5 + cfg.hyst ? cur : Math.round(f); }
function move(p){
  const d = drag, n = d.n, o = boardOrigin();
  d.last = p; d.client = {x:p.cx, y:p.cy};
  const now = performance.now(); d.samples.push({t:now, x:p.x, y:p.y}); while (d.samples.length > 6) d.samples.shift();
  if (!d.rs) {
    // where the hand is; the card either sits there (1:1) or springs after it
    d.px = p.x - o.x - d.offX; d.py = p.y - o.y - d.offY;
    if (!cfg.follow || reduceMotion.matches) { n.x = d.px; n.y = d.py; n.vx = n.vy = 0; paint(n); }
    // tilt follows horizontal velocity
    const s0 = d.samples[0], dtv = (now - s0.t) / 1000;
    const vx = dtv > 0.016 ? (p.x - s0.x) / dtv : 0;
    n.tr = cfg.tilt ? clamp(vx / 90, -4, 4) : 0;
    // snapping reads the hand, not the lagging card, so the placeholder stays responsive
    const nx = clamp(pick(d.px / CSTEP, d.tx), 0, cols - d.tw), ny = Math.max(0, pick(d.py / CSTEP, d.ty));
    if (nx !== d.tx || ny !== d.ty || !d.layout) { d.tx = nx; d.ty = ny; preview(); }
  } else {
    // the hand picks a raw cell size; the card only takes sizes its content opens, so the result snaps to the nearest open one
    const pw = Math.max(CELL * .55, d.w0 + (p.x - d.x0)), phh = Math.max(CELL * .55, d.h0 + (p.y - d.y0));
    const rw = clamp(pick((pw + GAP) / CSTEP, d.rw), 1, 3), rh = clamp(pick((phh + GAP) / CSTEP, d.rh), 1, 3);
    if (rw !== d.rw || rh !== d.rh || !d.layout) {
      d.rw = rw; d.rh = rh;
      const open = openOf(n.it.spec).filter(s => +s[0] <= cols - d.tx);
      const [tw, th] = snapTo(open.length ? open : ['1x1'], rw, rh);
      if (tw !== d.tw || th !== d.th || !d.layout) {
        d.tw = tw; d.th = th; n.tw = Wpx(tw); n.th = Wpx(th);
        n.key = ''; fill(n, n.it, tw, th); sizeTag(n, tw, th); preview();
      }
    }
  }
}
function preview(){
  const d = drag;
  d.layout = resolve(d.L0, d.n.it.id, d.tx, d.ty, d.tw, d.th);
  const me = d.layout.find(i => i.id === d.n.it.id);
  phs.tx = X(me.x); phs.ty = X(me.y); phs.tw = Wpx(me.w); phs.th = Wpx(me.h);
  previewTargets(d.layout, d.n.it.id);
}
function autoScroll(dt){
  const d = drag; if (!d) return;
  const edge = 70, max = 1400;
  const y = d.client.y, top = y - edge, bot = innerHeight - edge - y;
  let v = 0;
  if (top < 0) v = -max * Math.min(1, -top / edge); else if (bot < 0) v = max * Math.min(1, -bot / edge);
  if (!v) return;
  const before = scrollY; scrollBy(0, v * dt);
  if (scrollY !== before) move({...d.last, y:d.last.y + (scrollY - before)});
}
function land(list){
  const d = drag, n = d.n;
  drag = null; press = null;
  items = list.map(i => ({...i}));
  n.free = false;
  const me = items.find(i => i.id === n.it.id); n.it = me;
  // the dropped card keeps the hand's velocity and springs into its cell
  const s = d.samples, a = s[0], b = s[s.length - 1], dtv = (b.t - a.t) / 1000;
  if (!d.rs && !cfg.follow && dtv > 0.016) { n.vx = clamp((b.x - a.x) / dtv, -1800, 1800) * .6; n.vy = clamp((b.y - a.y) / dtv, -1800, 1800) * .6; }
  n.tr = 0;
  n.el.classList.remove('lift', 'rs'); n.el.classList.add('settling'); $('.szt', n.el)?.remove();
  sec.classList.remove('dragging'); ph.className = 'ph';
  if (d.rs) n.key = '';
  syncAll(false);
  save();
}
function drop(){ land(drag.layout || drag.L0); }
function cancel(){ const d = drag; land(d.L0); toast('已取消'); }

/* ============ panel & actions ============ */
const panel = $('#panel');
$('#panelHead').addEventListener('click', () => panel.classList.toggle('closed'));
const ctl = {k:$('#k'), c:$('#c'), fk:$('#fk'), fc:$('#fc'), follow:$('#follow'), hyst:$('#hyst'), mode:$('#mode'), compact:$('#compact'), tilt:$('#tilt'), gridAlways:$('#gridAlways')};
function reflect(){
  for (const key of ['k','c','fk','fc','hyst']) { ctl[key].value = cfg[key]; $('#' + key + 'O').textContent = key === 'hyst' ? cfg.hyst.toFixed(2) + ' 格' : cfg[key]; }
  ctl.mode.value = cfg.mode; ctl.follow.checked = cfg.follow; ctl.compact.checked = cfg.compact; ctl.tilt.checked = cfg.tilt; ctl.gridAlways.checked = cfg.gridAlways;
  sec.classList.toggle('grid-always', cfg.gridAlways);
}
for (const key of ['k','c','fk','fc','hyst']) ctl[key].addEventListener('input', () => { cfg[key] = +ctl[key].value; reflect(); save(); });
ctl.mode.addEventListener('change', () => { cfg.mode = ctl.mode.value; save(); });
ctl.compact.addEventListener('change', () => { cfg.compact = ctl.compact.checked; settleAll(); syncAll(false); save(); });
ctl.follow.addEventListener('change', () => { cfg.follow = ctl.follow.checked; save(); });
ctl.tilt.addEventListener('change', () => { cfg.tilt = ctl.tilt.checked; save(); });
ctl.gridAlways.addEventListener('change', () => { cfg.gridAlways = ctl.gridAlways.checked; reflect(); save(); });
$$('[data-preset]').forEach(b => b.addEventListener('click', () => { Object.assign(cfg, PRESETS[b.dataset.preset]); reflect(); save(); toast('已切换到「' + b.textContent + '」'); }));

$('#resetBtn').addEventListener('click', () => { items = SEED.map(o => ({...o})); cfg = {...DEFAULTS, theme:cfg.theme}; settleAll(); syncAll(false); reflect(); save(); toast('已恢复初始布局'); });
$('#shuffleBtn').addEventListener('click', () => {
  const pool = items.slice().sort(() => Math.random() - .5); const out = [];
  for (const it of pool) { const c = {...it, w:Math.min(it.w, cols)}; let y = 0, done = false;
    for (; y < 200 && !done; y++) for (let x = 0; x + c.w <= cols; x++) { const r = {...c, x, y}; if (!out.some(o => hit(r, o))) { out.push(r); done = true; break; } } }
  items = out; settleAll(); syncAll(false); save();
});
$('#addBtn').addEventListener('click', () => {
  const used = new Set(items.map(i => i.spec[1])); const free = EXTRA.filter(e => !used.has(e[0])); if (!free.length) return toast('样例链接用完了');
  const [link, w, h] = free[Math.floor(Math.random() * free.length)];
  const it = {id:'n' + Math.random().toString(36).slice(2, 7), spec:['link', link], x:0, y:rowsOf(items) + 2, w, h};
  outer: for (let y = 0; y < 400; y++) for (let x = 0; x + w <= cols; x++) { const r = {...it, x, y}; if (!items.some(o => hit(r, o))) { it.x = x; it.y = y; break outer; } }
  items.push(it); settleAll();
  const n = ensureNode(it); n.x = X(it.x); n.y = X(it.y) + 24; n.w = Wpx(it.w); n.h = Wpx(it.h); n.el.style.opacity = '0'; paint(n);
  requestAnimationFrame(() => { n.el.style.transition = 'opacity .25s'; n.el.style.opacity = '1'; });
  syncAll(false); save();
});
$('#themeBtn').addEventListener('click', () => {
  const dark = cfg.theme ? cfg.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  cfg.theme = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = cfg.theme; save();
});
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1600); }
document.addEventListener('click', e => { if (e.target.closest('.c a, a.lr')) e.preventDefault(); });

/* ============ boot ============ */
let rsT = 0;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { const c0 = cols; measure(); if (cols !== c0) settleAll(); syncAll(true); }, 60); });
measure(); settleAll(); reflect(); syncAll(true);
(document.fonts && document.fonts.ready || Promise.resolve()).then(() => { for (const n of nodes.values()) { n.key = ''; } syncAll(true); });
</script>
</body>
