<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bento Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap">
<style>
/* Layout concept: one Section on a coarse cell grid. Cards sit on whole cells; the pointer drags a lifted card freely,
   a placeholder shows where it will land, and every other card springs out of the way. */
:root{
  --bg:oklch(0.945 0.006 265);
  --surface:oklch(1 0 0);
  --surface-2:oklch(0.975 0.004 265);
  --glass:oklch(0.98 0.004 265 / 0.78);
  --ink:oklch(0.22 0.012 265);
  --ink-2:oklch(0.43 0.012 265);
  --ink-3:oklch(0.58 0.01 265);
  --line:oklch(0.25 0.02 265 / 0.09);
  --line-2:oklch(0.25 0.02 265 / 0.16);
  --accent:oklch(0.6 0.19 255);
  --accent-ink:oklch(0.99 0 0);
  --accent-soft:oklch(0.6 0.19 255 / 0.13);
  --sec-fill:oklch(0.99 0.002 265 / 0.6);
  --sec-line:oklch(0.25 0.02 265 / 0.06);
  --note:oklch(0.97 0.05 95);
  --note-ink:oklch(0.36 0.06 85);
  --dot:oklch(0.25 0.02 265 / 0.16);
  --scrim:oklch(0.15 0.01 265 / 0.55);
  --shadow:0 0 0 .5px oklch(0.2 0.02 265 / .08),0 1px 2px oklch(0.2 0.02 265 / .05),0 10px 24px -14px oklch(0.2 0.02 265 / .18);
  --shadow-hover:0 0 0 .5px oklch(0.2 0.02 265 / .1),0 2px 4px oklch(0.2 0.02 265 / .06),0 18px 36px -16px oklch(0.2 0.02 265 / .26);
  --shadow-lift:0 0 0 .5px oklch(0.2 0.02 265 / .1),0 8px 16px -6px oklch(0.2 0.02 265 / .18),0 36px 72px -20px oklch(0.2 0.02 265 / .42);
  --hl:inset 0 1px 0 oklch(1 0 0 / .9);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  --serif:"Newsreader","Songti SC","Noto Serif SC","STSong",Georgia,serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --r-card:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:oklch(0.17 0.006 265);--surface:oklch(0.235 0.008 265);--surface-2:oklch(0.21 0.008 265);--glass:oklch(0.2 0.008 265 / 0.78);
  --ink:oklch(0.95 0.004 265);--ink-2:oklch(0.78 0.008 265);--ink-3:oklch(0.62 0.01 265);
  --line:oklch(1 0 0 / 0.08);--line-2:oklch(1 0 0 / 0.14);--accent:oklch(0.7 0.16 255);--accent-ink:oklch(0.16 0.02 265);--accent-soft:oklch(0.7 0.16 255 / 0.18);
  --sec-fill:oklch(1 0 0 / 0.035);--sec-line:oklch(1 0 0 / 0.07);--note:oklch(0.32 0.04 90);--note-ink:oklch(0.93 0.05 92);--dot:oklch(1 0 0 / 0.14);--scrim:oklch(0.1 0.01 265 / 0.6);
  --shadow:0 0 0 .5px oklch(1 0 0 / .09),0 1px 2px oklch(0 0 0 / .3),0 10px 24px -14px oklch(0 0 0 / .6);
  --shadow-hover:0 0 0 .5px oklch(1 0 0 / .14),0 2px 4px oklch(0 0 0 / .3),0 18px 36px -16px oklch(0 0 0 / .7);
  --shadow-lift:0 0 0 .5px oklch(1 0 0 / .16),0 8px 16px -6px oklch(0 0 0 / .4),0 36px 72px -20px oklch(0 0 0 / .85);
  --hl:inset 0 1px 0 oklch(1 0 0 / .06);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:oklch(0.17 0.006 265);--surface:oklch(0.235 0.008 265);--surface-2:oklch(0.21 0.008 265);--glass:oklch(0.2 0.008 265 / 0.78);
  --ink:oklch(0.95 0.004 265);--ink-2:oklch(0.78 0.008 265);--ink-3:oklch(0.62 0.01 265);
  --line:oklch(1 0 0 / 0.08);--line-2:oklch(1 0 0 / 0.14);--accent:oklch(0.7 0.16 255);--accent-ink:oklch(0.16 0.02 265);--accent-soft:oklch(0.7 0.16 255 / 0.18);
  --sec-fill:oklch(1 0 0 / 0.035);--sec-line:oklch(1 0 0 / 0.07);--note:oklch(0.32 0.04 90);--note-ink:oklch(0.93 0.05 92);--dot:oklch(1 0 0 / 0.14);--scrim:oklch(0.1 0.01 265 / 0.6);
  --shadow:0 0 0 .5px oklch(1 0 0 / .09),0 1px 2px oklch(0 0 0 / .3),0 10px 24px -14px oklch(0 0 0 / .6);
  --shadow-hover:0 0 0 .5px oklch(1 0 0 / .14),0 2px 4px oklch(0 0 0 / .3),0 18px 36px -16px oklch(0 0 0 / .7);
  --shadow-lift:0 0 0 .5px oklch(1 0 0 / .16),0 8px 16px -6px oklch(0 0 0 / .4),0 36px 72px -20px oklch(0 0 0 / .85);
  --hl:inset 0 1px 0 oklch(1 0 0 / .06);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
a{color:inherit;text-decoration:none;-webkit-user-drag:none}
svg{-webkit-user-drag:none;display:block}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:14px;height:52px;margin:0 -16px;padding:0 20px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 1px 0 var(--line)}
.top .brand{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
.top .crumb{color:var(--ink-3);display:flex;align-items:center;gap:8px;font-size:12.5px}
.top .crumb b{color:var(--ink-2);font-weight:550}
.top .sp{flex:1}
.tb{height:30px;padding:0 11px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;color:var(--ink-2);transition:background .15s,color .15s}
.tb:hover{background:var(--line);color:var(--ink)}
.tb:active{transform:scale(.97)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb .ic{width:14px;height:14px}

/* ---------- section ---------- */
.wrap{max-width:1120px;margin:0 auto;padding-top:34px}
.sec-head{display:flex;align-items:baseline;gap:10px;padding:0 8px 12px}
.sec-head h1{margin:0;font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
.sec-head .n{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sec-head .hint{margin-left:auto;font-size:12.5px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.sec-head kbd{font:inherit;font-size:11px;padding:1px 5px;border-radius:5px;background:var(--line);color:var(--ink-2)}
.sec{position:relative;border-radius:32px;background:var(--sec-fill);box-shadow:inset 0 0 0 1px var(--sec-line);padding:var(--pad);
  transition:height .34s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.sec.dragging{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.board{position:relative}
/* grid dots: one dot per cell corner, visible while a card is in the air (or always, from the panel) */
.gridlines{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.6px);background-size:var(--step) var(--step);background-position:calc(var(--gap) * -1) calc(var(--gap) * -1);
  margin:calc(var(--gap) * .5 * -1);}
.sec.dragging .gridlines,.sec.grid-always .gridlines{opacity:1}

/* placeholder: where the lifted card will land */
.ph{position:absolute;left:0;top:0;border-radius:var(--r-card);background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);
  opacity:0;transition:opacity .18s;pointer-events:none;will-change:transform}
.ph.on{opacity:1}

/* ---------- cards ---------- */
.card{position:absolute;left:0;top:0;will-change:transform;touch-action:pan-y;z-index:1}
.card.pressed .in{scale:.985}
.card.lift{z-index:30}
.card.settling{z-index:20}
.card .in{position:absolute;inset:0;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--shadow),var(--hl);overflow:hidden;
  display:flex;transform-origin:50% 50%;transition:scale .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;
  corner-shape:squircle}
.card:hover .in{box-shadow:var(--shadow-hover),var(--hl)}
.card.lift .in{scale:1.035;box-shadow:var(--shadow-lift),var(--hl);transition:scale .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.card.lift.rs .in{scale:1}
.card.lift,.card.lift *{cursor:grabbing}
.card.lift.rs,.card.lift.rs *{cursor:nwse-resize}
.sec.dragging .card:not(.lift) .in{box-shadow:var(--shadow),var(--hl)}
/* resize handle */
.rz{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;opacity:0;transition:opacity .15s;z-index:5}
.rz::after{content:"";position:absolute;right:7px;bottom:7px;width:9px;height:9px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);border-radius:0 0 3px 0;opacity:.7}
.card:hover .rz{opacity:1}
.sec.dragging .rz{opacity:0}

/* card content (ported from the Links design: art + txt, modes tiny / wide / hero / tall / media) */
.card .in{flex-direction:column}
.art{position:relative;flex:1;min-height:0;margin:6px 6px 0;border-radius:12px;overflow:hidden;background:var(--tint);container-type:size;color:#fff;display:block}
@supports (corner-shape:squircle){.art{border-radius:16px;corner-shape:squircle}}
.txt{flex:none;padding:9px 12px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ttl{--ln:2;font-size:13.5px;font-weight:600;letter-spacing:-.008em;line-height:1.28;display:block;max-height:calc(var(--ln) * 1lh);overflow:hidden;overflow-wrap:anywhere;word-break:normal}
.meta{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:11.5px;min-width:0;white-space:nowrap;overflow:hidden}
.meta > span:not(.chip):not(.fav){flex:0 1 auto;min-width:0;overflow:hidden}
.chip{flex:none;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--line);color:var(--ink-2)}
.chip.warn{background:oklch(0.8 0.12 75 / .22);color:oklch(0.5 0.12 65)}
.chip.ok{background:oklch(0.7 0.15 150 / .16);color:oklch(0.5 0.13 150)}
.fav{width:16px;height:16px;border-radius:4.5px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;background:var(--tint);flex:none;box-shadow:inset 0 0 0 .5px oklch(0 0 0 / .14);font-family:var(--ui)}
.note-q{--ln:2;font-size:12.5px;color:var(--ink-2);line-height:1.45;max-height:calc(var(--ln) * 1lh);overflow:hidden}
.note-q:before{content:"";display:inline-block;width:3px;height:.9em;margin-right:6px;border-radius:2px;background:var(--note-ink);opacity:.35;vertical-align:-1px}
.m-tiny .txt{flex:1;padding:10px 11px;justify-content:space-between}
.m-tiny .ttl{font-size:12.5px;--ln:3}
.m-tiny .fav{width:20px;height:20px;border-radius:6px;font-size:11px}
.in.m-wide{flex-direction:row}
.m-wide .art{flex:none;margin:6px 0 6px 6px}
.m-wide .txt{flex:1;justify-content:center;padding:8px 12px}
.in.m-hero{flex-direction:row}
.m-hero .art{flex:none;width:58%;margin:6px 0 6px 6px}
.m-hero .txt{flex:1;justify-content:flex-end;padding:14px 16px 16px;gap:6px}
.m-hero .ttl{font-size:19px;letter-spacing:-.02em;--ln:4;line-height:1.2}
.m-tall .ttl.big{font-size:17px;letter-spacing:-.016em;line-height:1.22}
.m-tall .txt{gap:4px}
/* covers */
.a-gh{background:#0D1117;color:#E6EDF3;padding:12px 14px;display:flex;flex-direction:column;gap:7px;font-family:var(--mono)}
.a-gh .r{display:flex;align-items:center;gap:6px;font-size:clamp(9px,6cqw,13px);color:#9198A1;white-space:nowrap;overflow:hidden}
.a-gh .r i{width:clamp(10px,7cqw,16px);height:clamp(10px,7cqw,16px);border-radius:50%;background:#E6EDF3;flex:none;box-shadow:inset 0 0 0 3px #0D1117,0 0 0 1px #E6EDF3}
.a-gh .t{font-family:var(--ui);font-size:clamp(10px,8.4cqw,22px);font-weight:600;line-height:1.22;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.a-gh .s{margin-top:auto;display:inline-flex;align-self:flex-start;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;background:#238636;color:#fff;font-family:var(--ui);font-size:clamp(9px,5cqw,12px);font-weight:600}
.a-gh .s.merged{background:#8957E5}
@container (max-height:130px){.a-gh .t{-webkit-line-clamp:2}.a-gh .r{display:none}}
.a-paper{background:#FBFAF6;color:#1B1B1B;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.a-paper .id{font-family:var(--mono);font-size:clamp(8px,4.6cqw,11px);color:#B31B1B;letter-spacing:.02em}
.a-paper .t{font-family:var(--serif);font-size:clamp(12px,11cqw,30px);font-weight:500;line-height:1.08;letter-spacing:-.01em}
.a-paper .au{font-family:var(--serif);font-style:italic;font-size:clamp(8px,4.8cqw,12px);color:#5A5A5A;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.a-paper .ln{margin-top:auto;display:flex;flex-direction:column;gap:3cqh}
.a-paper .ln i{height:max(2px,1.4cqh);border-radius:2px;background:#E7E3DA}
.a-paper .ln i:nth-child(2){width:86%}.a-paper .ln i:nth-child(3){width:64%}
.a-video{background:radial-gradient(120% 90% at 20% 15%,color-mix(in oklch,var(--tint) 85%,#fff),transparent 60%),linear-gradient(160deg,color-mix(in oklch,var(--tint) 70%,#000),#141414)}
.a-video .orb{position:absolute;border-radius:50%;filter:blur(18px);opacity:.55;pointer-events:none}
.a-video .orb.a{width:70cqw;height:70cqw;left:-12cqw;top:-24cqw;background:color-mix(in oklch,var(--tint) 70%,#fff)}
.a-video .orb.b{width:60cqw;height:60cqw;right:-18cqw;bottom:-30cqw;background:color-mix(in oklch,var(--tint) 55%,#000);opacity:.7}
.a-video .pl{position:absolute;left:7cqw;bottom:8cqh;width:clamp(22px,16cqw,40px);height:clamp(22px,16cqw,40px);border-radius:50%;display:grid;place-items:center;background:oklch(0 0 0 / .45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.a-video .pl:after{content:"";margin-left:12%;border-left:clamp(7px,4.6cqw,12px) solid #fff;border-top:clamp(5px,3cqw,8px) solid transparent;border-bottom:clamp(5px,3cqw,8px) solid transparent}
.a-video .du{position:absolute;right:6cqw;bottom:8cqh;padding:2px 6px;border-radius:5px;background:oklch(0 0 0 / .6);font-size:clamp(9px,5cqw,12px);font-weight:600;font-variant-numeric:tabular-nums}
.a-video .pt{position:absolute;right:6cqw;top:7cqh;padding:2px 6px;border-radius:5px;background:oklch(1 0 0 / .9);color:#111;font-size:clamp(8px,4.4cqw,11px);font-weight:700}
.a-photo{background:radial-gradient(60% 50% at 78% 22%,#FFE9C2 0,#FFD7A0 18%,transparent 60%),radial-gradient(90% 70% at 10% 100%,#5B3A2A,transparent 70%),linear-gradient(180deg,#E7B88A,#A9724C 70%,#6E4430)}
.a-photo:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 14%,oklch(0.2 0.03 50 / .22) 14% 19%,transparent 19% 30%);mix-blend-mode:multiply}
.a-photo:after{content:"";position:absolute;left:18%;right:30%;bottom:9%;height:26%;border-radius:50% 50% 10% 10%;background:radial-gradient(60% 80% at 50% 30%,#F3E6D4,#CDB79B);box-shadow:0 8px 18px oklch(0.2 0.05 50 / .45)}
.a-photo .xh{position:absolute;left:6cqw;bottom:5cqh;z-index:1;font-size:clamp(9px,5cqw,12px);font-weight:600;color:#fff;text-shadow:0 1px 6px oklch(0 0 0 / .4);display:flex;align-items:center;gap:4px}
.a-shot{background:#F2F2F4;color:#111;display:flex;flex-direction:column}
.a-shot .ch{height:max(14px,9cqh);display:flex;align-items:center;gap:4px;padding:0 5cqw;background:#E4E4E8;flex:none}
.a-shot .ch i{width:max(5px,2.2cqw);height:max(5px,2.2cqw);border-radius:50%;background:#C9C9CE}
.a-shot .ch span{margin-left:3cqw;flex:1;height:58%;border-radius:4px;background:#F7F7F9;font-size:clamp(7px,3cqw,10px);color:#8A8A90;display:flex;align-items:center;padding:0 2cqw;overflow:hidden;white-space:nowrap}
.a-shot .pg{flex:1;padding:6cqh 6cqw;display:grid;grid-template-columns:1.1fr .9fr;gap:4cqw;align-items:center}
.a-shot .h{font-size:clamp(10px,5.6cqw,26px);font-weight:750;letter-spacing:-.03em;line-height:1.05}
.a-shot .h em{font-style:normal;color:#7C5CFF}
.a-shot .sub{margin-top:3cqh;display:flex;flex-direction:column;gap:2cqh}
.a-shot .sub i{height:max(3px,1.6cqh);border-radius:3px;background:#D9D9DE}
.a-shot .sub i:last-child{width:70%}
.a-shot .cta{margin-top:4cqh;width:44%;height:max(10px,7cqh);border-radius:99px;background:#111}
.a-shot .mock{height:78%;border-radius:8px;background:linear-gradient(180deg,#fff,#EDEAFF);box-shadow:0 6px 18px -6px oklch(0.3 0.1 290 / .35),inset 0 0 0 1px #E2DEFF;display:flex;gap:4%;padding:5%}
.a-shot .mock b{width:28%;border-radius:5px;background:#EFEDFB;display:block}
.a-shot .mock u{flex:1;border-radius:5px;background:repeating-linear-gradient(to bottom,#F6F5FE 0 16%,#fff 16% 22%);display:block}
.a-chat{background:#F7F7F8;padding:12px 12px;display:flex;flex-direction:column;gap:7px;color:#111}
.a-chat .u{align-self:flex-end;max-width:78%;padding:3cqh 4cqw;border-radius:12px;background:#E9E9EB;font-size:clamp(8px,5cqw,13px);line-height:1.3}
.a-chat .b{display:flex;gap:3cqw;font-size:clamp(8px,4.6cqw,12px);line-height:1.4;color:#333}
.a-chat .b i{flex:none;width:clamp(12px,7cqw,20px);height:clamp(12px,7cqw,20px);border-radius:50%;background:#10A37F}
.a-chat .b span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.a-stock{background:radial-gradient(70% 60% at 30% 40%,#A9B8C9,transparent 70%),radial-gradient(60% 60% at 75% 70%,#58677A,transparent 70%),linear-gradient(135deg,#C9D2DC,#7E8B9B)}
.a-stock:after{content:"";position:absolute;left:26%;top:22%;width:30%;height:58%;border-radius:40% 40% 8% 8%;background:linear-gradient(180deg,#2D3440,#465061);filter:blur(1.5px);opacity:.75}
.a-stock .wm{position:absolute;right:5cqw;bottom:5cqh;font-size:clamp(8px,4cqw,11px);font-weight:700;color:#fff;opacity:.8;letter-spacing:.04em}
.a-type{background:color-mix(in oklch,var(--tint) 10%,var(--surface));color:var(--ink);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between}
.a-type .t{font-size:clamp(12px,10.5cqw,30px);font-weight:700;letter-spacing:-.025em;line-height:1.08;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;overflow-wrap:anywhere}
.a-type .d{font-size:clamp(8px,4.6cqw,12px);color:color-mix(in oklch,var(--tint) 70%,var(--ink));font-weight:600;display:flex;align-items:center;gap:5px}
.a-brand{background:linear-gradient(150deg,color-mix(in oklch,var(--tint) 88%,#fff),var(--tint) 60%,color-mix(in oklch,var(--tint) 75%,#000));display:grid;place-items:center}

/* ============ layout: make room ============ */
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

            const c = {x:xx, y:yy, w:it.w, h:it.h};

/* ============ cards ============ */
const nodes = new Map();

// pick the card's mode from its pixel size, same thresholds as the Links design
function modeOf(it, W, H){

function fill(n, it, w, h){

function tintOf(it){ if (it.kind === 'note') return '#E8C547'; if (it.kind === 'list') return '#9AA3B2'; return SITES[L[it.link].site].t; }

/* ============ springs ============ */
// One spring per axis, integrated every frame. Retargeting keeps velocity, so a card that is sent back

/* ============ pointer: press, lift, drag, drop ============ */
let press = null, drag = null;

function autoScroll(dt){
  const d = drag; if (!d) return;
  const edge = 70, max = 1400;
  const y = d.client.y, top = y - edge, bot = innerHeight - edge - y;
  let v = 0;
  if (top < 0) v = -max * Math.min(1, -top / edge); else if (bot < 0) v = max * Math.min(1, -bot / edge);
  if (!v) return;
  const before = scrollY; scrollBy(0, v * dt);
  if (scrollY !== before) move({...d.last, y:d.last.y + (scrollY - before)});
}
function land(list){
  const d = drag, n = d.n;
  drag = null; press = null;
  items = list.map(i => ({...i}));
  n.free = false;
  const me = items.find(i => i.id === n.it.id); n.it = me;
  // the dropped card keeps the hand's velocity and springs into its cell
  const s = d.samples, a = s[0], b = s[s.length - 1], dtv = (b.t - a.t) / 1000;
  if (!d.rs && !cfg.follow && dtv > 0.016) { n.vx = clamp((b.x - a.x) / dtv, -1800, 1800) * .6; n.vy = clamp((b.y - a.y) / dtv, -1800, 1800) * .6; }
  n.tr = 0;
  n.el.classList.remove('lift', 'rs'); n.el.classList.add('settling');
  sec.classList.remove('dragging'); ph.className = 'ph';
  syncAll(false);
  save();
}
function drop(){ land(drag.layout || drag.L0); }
function cancel(){ const d = drag; land(d.L0); toast('已取消'); }

/* ============ panel & actions ============ */
const panel = $('#panel');
$('#panelHead').addEventListener('click', () => panel.classList.toggle('closed'));
const ctl = {cols:$('#cols'), gap:$('#gap'), k:$('#k'), c:$('#c'), fk:$('#fk'), fc:$('#fc'), follow:$('#follow'), hyst:$('#hyst'), mode:$('#mode'), compact:$('#compact'), tilt:$('#tilt'), gridAlways:$('#gridAlways')};
function reflect(){
  for (const key of ['cols','gap','k','c','fk','fc','hyst']) { ctl[key].value = cfg[key]; $('#' + key + 'O').textContent = key === 'hyst' ? cfg.hyst.toFixed(2) + ' 格' : key === 'gap' ? cfg.gap + ' px' : cfg[key]; }
  ctl.mode.value = cfg.mode; ctl.follow.checked = cfg.follow; ctl.compact.checked = cfg.compact; ctl.tilt.checked = cfg.tilt; ctl.gridAlways.checked = cfg.gridAlways;
  sec.classList.toggle('grid-always', cfg.gridAlways);
}
for (const key of ['k','c','fk','fc','hyst']) ctl[key].addEventListener('input', () => { cfg[key] = +ctl[key].value; reflect(); save(); });
for (const key of ['cols','gap']) ctl[key].addEventListener('input', () => { cfg[key] = +ctl[key].value; measure(); settleAll(); for (const n of nodes.values()) n.key = ''; syncAll(false); reflect(); save(); });
ctl.mode.addEventListener('change', () => { cfg.mode = ctl.mode.value; save(); });
ctl.compact.addEventListener('change', () => { cfg.compact = ctl.compact.checked; settleAll(); syncAll(false); save(); });
ctl.follow.addEventListener('change', () => { cfg.follow = ctl.follow.checked; save(); });
ctl.tilt.addEventListener('change', () => { cfg.tilt = ctl.tilt.checked; save(); });
ctl.gridAlways.addEventListener('change', () => { cfg.gridAlways = ctl.gridAlways.checked; reflect(); save(); });
$$('[data-preset]').forEach(b => b.addEventListener('click', () => { Object.assign(cfg, PRESETS[b.dataset.preset]); reflect(); save(); toast('已切换到「' + b.textContent + '」'); }));

$('#resetBtn').addEventListener('click', () => { items = SEED.map(o => ({...o})); cfg = {...DEFAULTS, theme:cfg.theme}; measure(); settleAll(); for (const n of nodes.values()) n.key = ''; syncAll(false); reflect(); save(); toast('已恢复初始布局'); });
$('#shuffleBtn').addEventListener('click', () => {
  const pool = items.slice().sort(() => Math.random() - .5); const out = [];
  for (const it of pool) { const c = {...it, w:Math.min(it.w, cfg.cols)}; let y = 0, done = false;
    for (; y < 200 && !done; y++) for (let x = 0; x + c.w <= cfg.cols; x++) { const r = {...c, x, y}; if (!out.some(o => hit(r, o))) { out.push(r); done = true; break; } } }
  items = out; settleAll(); syncAll(false); save();
});
$('#addBtn').addEventListener('click', () => {
  const used = new Set(items.map(i => i.link)); const free = EXTRA.filter(l => !used.has(l)); if (!free.length) return toast('样例链接用完了');
  const link = free[Math.floor(Math.random() * free.length)]; const sizes = [[1,1],[2,1],[2,2]]; const [w, h] = sizes[Math.floor(Math.random() * sizes.length)];
  const it = {id:'n' + Math.random().toString(36).slice(2, 7), kind:'card', link, x:0, y:rowsOf(items) + 2, w, h};
  // find the first free slot in reading order
  outer: for (let y = 0; y < 400; y++) for (let x = 0; x + w <= cfg.cols; x++) { const r = {...it, x, y}; if (!items.some(o => hit(r, o))) { it.x = x; it.y = y; break outer; } }
  items.push(it); settleAll();
  const n = ensureNode(it); n.x = X(it.x); n.y = X(it.y) + 24; n.w = Wpx(it.w); n.h = Wpx(it.h); n.el.style.opacity = '0'; paint(n);
  requestAnimationFrame(() => { n.el.style.transition = 'opacity .25s'; n.el.style.opacity = '1'; });
  syncAll(false); save();
});
$('#themeBtn').addEventListener('click', () => {
  const dark = cfg.theme ? cfg.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  cfg.theme = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = cfg.theme; save();
});
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1600); }

/* ============ boot ============ */
let rsT = 0;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { measure(); for (const n of nodes.values()) n.key = ''; syncAll(true); }, 60); });
measure(); settleAll(); reflect(); syncAll(true);
</script>
</body>
